name: Bootstrap bundled Noto font

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-noto-font.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify Noto Sans CJK SC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/fonts
          curl -fL --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" \
            -o public/fonts/NotoSansCJKsc-Regular.otf
          echo "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  public/fonts/NotoSansCJKsc-Regular.otf" | sha256sum -c -

      - name: Commit verified font
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fonts/NotoSansCJKsc-Regular.otf
          git rm .github/workflows/bootstrap-noto-font.yml
          git commit -m "chore: bundle verified Noto Sans CJK font"
          git push origin HEAD:main
